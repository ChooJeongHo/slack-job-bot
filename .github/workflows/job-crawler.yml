name: 채용공고 자동 발송

on:
  schedule:
    - cron: '5 3 * * 1-5'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 패키지 설치
        run: pip install requests beautifulsoup4
      - name: 채용공고 수집 및 발송
        env:
          JOB_NEWS_WEBHOOK_URL: ${{ secrets.JOB_NEWS_WEBHOOK_URL }}
        run: python job_crawler.py
